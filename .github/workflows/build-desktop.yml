name: Build desktop app

# Builds the ATC Live desktop app for Windows, macOS and Linux.
# Each platform builds on its own runner because electron-builder needs the
# native toolchain (Windows needs signtool, macOS needs hdiutil) — cross-building
# from Linux does not work without wine.
#
# Run it from the Actions tab, then download the installer from "Artifacts"
# at the bottom of the run page.
#
# The project lives in atc-live/; workflows have to stay at the repository root,
# so every step runs from there via the defaults below.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/atc-radio-app-**'
    paths:
      - 'atc-live/app/**'
      - 'atc-live/server/**'
      - 'atc-live/web/**'
      - 'atc-live/electron-main.js'
      - 'atc-live/preload.js'
      - 'atc-live/package.json'
      - '.github/workflows/build-desktop.yml'

defaults:
  run:
    working-directory: atc-live

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: atc-live/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: 'atc-live/dist/*.exe'
          - os: macos-latest
            name: macos
            artifact: 'atc-live/dist/*.dmg'
          - os: ubuntu-latest
            name: linux
            artifact: 'atc-live/dist/*.AppImage'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: atc-live/package-lock.json

      - run: npm ci

      # electron-builder signs by default; there are no certificates here, so
      # turn signing off rather than failing the build on a missing identity.
      - name: Build
        run: npm run build:electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # upload-artifact resolves paths from the repository root, not the
      # working-directory default, so these stay prefixed.
      - uses: actions/upload-artifact@v4
        with:
          name: atc-live-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
