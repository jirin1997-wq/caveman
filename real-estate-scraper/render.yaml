services:
  - type: web
    name: reality-scout-api
    runtime: node
    plan: free
    buildCommand: npm install && cd frontend && npm install && cd .. && npm run build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        fromService:
          name: reality-scout-web
          type: web
          property: url
      - key: DATABASE_URL
        fromDatabase:
          name: realestate-db
          property: connectionString
      - key: SCRAPER_CITIES
        value: praha

  - type: web
    name: reality-scout-web
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: reality-scout-api
          type: web
          property: url
        value: /api

  - type: cron
    name: reality-scout-scraper
    runtime: node
    plan: free
    startCommand: node backend/cron.js
    schedule: "0 2 * * *"
    buildCommand: npm install
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCRAPER_CITIES
        value: praha
      - key: DATABASE_URL
        fromDatabase:
          name: realestate-db
          property: connectionString

databases:
  - name: realestate-db
    plan: free
    databaseName: realestate_prod
