<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎭 Voice Character Emulator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.1em;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    select, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 1em;
      font-family: inherit;
      transition: border-color 0.3s;
    }

    select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .row.full {
      grid-template-columns: 1fr;
    }

    @media (max-width: 768px) {
      .row {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 1.8em;
      }
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1em;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: #667eea;
      font-weight: 600;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #ddd;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result {
      display: none;
      margin-top: 30px;
    }

    .result.show {
      display: block;
    }

    .result-content {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .result-title {
      font-size: 1.3em;
      font-weight: 600;
      margin-bottom: 15px;
      color: #667eea;
    }

    .result-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
      font-size: 0.9em;
    }

    .meta-item {
      padding: 10px;
      background: white;
      border-radius: 6px;
      border-left: 3px solid #667eea;
    }

    .meta-label {
      font-weight: 600;
      color: #667eea;
    }

    .meta-value {
      color: #666;
      margin-top: 4px;
    }

    audio {
      width: 100%;
      margin: 15px 0;
      border-radius: 6px;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .button-secondary {
      background: #6c757d;
    }

    .button-secondary:hover {
      box-shadow: 0 10px 20px rgba(108, 117, 125, 0.3);
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      border-left: 4px solid #c33;
      display: none;
    }

    .error.show {
      display: block;
    }

    .character-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      .character-grid {
        grid-template-columns: 1fr;
      }
    }

    .character-option {
      padding: 12px;
      background: #f8f9fa;
      border: 2px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.9em;
    }

    .character-option:hover {
      border-color: #667eea;
      background: #f0f2ff;
    }

    .character-name {
      font-weight: 600;
      color: #333;
    }

    .character-actor {
      color: #666;
      font-size: 0.85em;
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #ddd;
    }

    .tab-button {
      background: none;
      color: #666;
      border: none;
      padding: 12px 20px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      width: auto;
    }

    .tab-button.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎭 Voice Character Emulator</h1>
      <p class="subtitle">Give voice to iconic characters</p>
    </header>

    <div class="card">
      <div class="tabs">
        <button class="tab-button active" data-tab="synthetic">🤖 Synthetic Voices</button>
        <button class="tab-button" data-tab="cloned">🎬 Dubbed Voices</button>
      </div>

      <div id="synthetic" class="tab-content active">
        <form id="synthForm">
          <div class="form-group">
            <label>Character</label>
            <div id="synthetic-characters" class="character-grid"></div>
          </div>

          <div class="row">
            <div class="form-group">
              <label for="synthetic-language">Language</label>
              <select id="synthetic-language">
                <option value="en">🇬🇧 English</option>
                <option value="cs">🇨🇿 Čeština</option>
              </select>
            </div>

            <div class="form-group">
              <label for="synthetic-emotion">Emotion</label>
              <select id="synthetic-emotion">
                <option value="neutral">Neutral</option>
              </select>
            </div>
          </div>

          <div class="form-group full">
            <label for="synthetic-text">Text to Voice</label>
            <textarea id="synthetic-text" placeholder="Enter text for the character to speak...">I am Iron Man.</textarea>
          </div>

          <button type="submit">Generate Voice 🎤</button>
          <input type="hidden" id="synthetic-character" value="">
        </form>
      </div>

      <div id="cloned" class="tab-content">
        <form id="clonedForm">
          <div class="form-group">
            <label>Character (Dubbed by Czech Actors)</label>
            <div id="cloned-characters" class="character-grid"></div>
          </div>

          <div class="row">
            <div class="form-group">
              <label for="cloned-language">Language</label>
              <select id="cloned-language">
                <option value="en">🇬🇧 English (Original Actor)</option>
                <option value="cs">🇨🇿 Čeština (Czech Dubbing)</option>
              </select>
            </div>

            <div class="form-group">
              <label for="cloned-emotion">Emotion</label>
              <select id="cloned-emotion">
                <option value="neutral">Neutral</option>
              </select>
            </div>
          </div>

          <div class="form-group full">
            <label for="cloned-text">Text to Voice</label>
            <textarea id="cloned-text" placeholder="Enter text for the character to speak...">I am Batman.</textarea>
          </div>

          <button type="submit">Generate Voice 🎤</button>
          <input type="hidden" id="cloned-character" value="">
        </form>
      </div>

      <div class="loading" id="loading">
        <div class="spinner"></div> Generating voice...
      </div>

      <div class="error" id="error"></div>

      <div class="result" id="result">
        <div class="result-title">Generated Voice</div>
        <div class="result-content">
          <div class="result-meta">
            <div class="meta-item">
              <div class="meta-label">Character</div>
              <div class="meta-value" id="result-character"></div>
            </div>
            <div class="meta-item">
              <div class="meta-label">Type</div>
              <div class="meta-value" id="result-type"></div>
            </div>
            <div class="meta-item">
              <div class="meta-label">Language</div>
              <div class="meta-value" id="result-language"></div>
            </div>
            <div class="meta-item">
              <div class="meta-label">Duration</div>
              <div class="meta-value" id="result-duration"></div>
            </div>
          </div>
          <audio id="result-audio" controls></audio>
        </div>
        <div class="button-group">
          <button class="button-secondary" onclick="document.getElementById('result').classList.remove('show')">Close</button>
          <button id="downloadBtn">Download MP3</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
