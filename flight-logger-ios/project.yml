# XcodeGen spec — the fallback path.
#
# FlightLogger.xcodeproj is checked in and opens directly in Xcode 16 or newer.
# If your Xcode is older (the project uses file-system-synchronized groups,
# objectVersion 77) or the project ever gets mangled, regenerate it:
#
#     brew install xcodegen
#     cd flight-logger-ios && xcodegen generate
#
name: FlightLogger
options:
  bundleIdPrefix: cz.letovyzapisovac
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: cs
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  FlightLogger:
    type: application
    platform: iOS
    sources:
      - path: FlightLogger
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: cz.letovyzapisovac.FlightLogger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
  FlightLoggerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlightLoggerTests
    dependencies:
      - target: FlightLogger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.letovyzapisovac.FlightLoggerTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  FlightLogger:
    build:
      targets:
        FlightLogger: all
    test:
      targets:
        - FlightLoggerTests
